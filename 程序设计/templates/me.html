<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人中心</title>
<style>
    /* ===== 左侧菜单项 ===== */
    .left_item{
        position: relative;
        width: 120px;
        height: 50px;
        line-height: 50px;
        text-align: center;
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        cursor: pointer;
        display: block;             
        box-sizing: border-box;
        color: #333;
        text-decoration: none;
    }
    .left_item:hover{ background-color: #e4e4e4; }
    .left_item.active{
        background-color: #d4c7c7; 
        font-weight: bold;
    }

    /* 「个人中心」含子菜单，高度改为自适应以免子项溢出 */
    #self{ height: auto; }

    /* ===== 右侧内容区 ===== */
    .right_context1{
        position: relative;
        margin-top: -200px;      /* 菜单固定全部展开，位置不再随登录态变化 */
        float: left;
        left: 30%;
        width: 50%;
        min-height: 200px;         
        line-height: 50px;
        text-align: center;
        background-color: #d4c7c7;
        border: 1px solid #ccc;
        cursor: pointer;
        padding: 20px;
        box-sizing: border-box;
    }

    /* ===== 右侧内部元素 ===== */
    .right_context1 h2{
        margin: 0;
        font-size: 18px;
        line-height: 40px;
    }
    .api_info{
        margin-bottom: 10px;
        padding: 0 10px;
        background-color: #efe9e9;
        border: 1px dashed #b5a8a8;
        font-size: 13px;
        line-height: 26px;
    }
    .field{
        line-height: 30px;
    }
    .field label{
        display: inline-block;
        width: 70px;
        text-align: right;
        margin-right: 8px;
    }
    .field input{
        width: 200px;
        height: 26px;
        line-height: 26px;
        padding: 0 6px;
        border: 1px solid #999;
        box-sizing: border-box;
    }
    button{
        height: 30px;
        padding: 0 18px;
        cursor: pointer;
    }
    /* 面板里的说明文字 */
    .tip{
        margin: 0 0 10px 0;
        font-size: 12px;
        line-height: 18px;
        color: #6b5f5f;
    }
    /* 响应展示 */
    #result{
        margin-top: 14px;
        padding: 8px 10px;
        min-height: 20px;
        background-color: #f7f4f4;
        border: 1px solid #b5a8a8;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 18px;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
    }
</style>
</head>
<body>

<!-- ==================== 左侧菜单（选项保持完整，点击跳转各自页面） ==================== -->
<!-- href 对应 app.py 现有路由：/register  /login  /user_list  /me -->
<a class="left_item" id="sign_up" href="/register">用户注册</a>
<a class="left_item" id="sign_in" href="/login">用户登录</a>
<a class="left_item" id="users_list" href="/user_list">查看用户列表</a>
<div class="left_item active" id="self">个人中心
    <div>
        <!-- 个人中心 4 项都走 /me，用 ?action= 区分 -->
        <a class="left_item" id="self_info" href="/me?action=info">查看个人信息</a>
        <a class="left_item" id="self_edit_username" href="/me?action=username">修改用户名</a>
        <a class="left_item" id="self_edit_password" href="/me?action=password">修改密码</a>
        <a class="left_item" id="self_delete" href="/me?action=delete">注销账号</a>
    </div>
</div>

<!-- ==================== 右侧内容区：个人中心 4 个操作，按 ?action= 切换 ==================== -->
<div class="right_context1">
    <h2>个人中心</h2>

    <!-- 由 menu.js 根据当前 action 自动改写 -->
    <div class="api_info" id="action_hint">GET /users/me</div>

    <!-- ---------- 3. 查看个人信息  GET /users/me ---------- -->
    <div class="panel" data-panel="info" style="display:block">
        <form id="me_info_form">
            <div class="field">
                <label for="info_id">id:</label>
                <input type="text" id="info_id" readonly value="-">
            </div>
            <div class="field">
                <label for="info_username">用户名:</label>
                <input type="text" id="info_username" readonly value="-">
            </div>
            <!-- <div class="field">
                <label for="info_create_time">创建时间:</label>
                <input type="text" id="info_create_time" readonly value="-">
            </div>
            <div class="field">
                <label for="info_update_time">更新时间:</label>
                <input type="text" id="info_update_time" readonly value="-">
            </div> -->
            <button type="submit">刷新</button>
        </form>
    </div>

    <!-- ---------- 5. 修改用户名  PATCH /users/me ---------- -->
    <div class="panel" data-panel="username" style="display:none">
        <form id="me_username_form">
            <div class="field">
                <label for="new_username">新用户名:</label>
                <input type="text" id="new_username" name="new_username" required>
            </div>
            <div class="field">
                <label for="un_password">当前密码:</label>
                <input type="password" id="un_password" name="password" required>
            </div>
            <button type="submit">修改用户名</button>
        </form>
    </div>

    <!-- ---------- 6. 修改密码  PATCH /users/me ---------- -->
    <div class="panel" data-panel="password" style="display:none">
        <div class="tip">与「修改用户名」同为 PATCH /users/me，通过请求体字段区分。</div>
        <form id="me_password_form">
            <div class="field">
                <label for="old_password">原密码:</label>
                <input type="password" id="old_password" name="old_password" required>
            </div>
            <div class="field">
                <label for="new_password">新密码:</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <button type="submit">修改密码</button>
        </form>
    </div>

    <!-- ---------- 7. 注销账号  DELETE /users/me ---------- -->
    <div class="panel" data-panel="delete" style="display:none">
        <div class="tip">注销需密码二次确认。DELETE 带请求体可能被网关丢弃，可改用 POST /users/me/deactivate。</div>
        <form id="me_delete_form">
            <div class="field">
                <label for="del_password">密码:</label>
                <input type="password" id="del_password" name="password" required>
            </div>
            <button type="submit">注销账号</button>
        </form>
    </div>

    <!-- 响应统一显示在这里 -->
    <div id="result">响应(sessionId)将显示在这里</div>
</div>

<!-- 左侧菜单 + 个人中心 4 项切换（四个页面共用） -->
<script src="{{ url_for('static', filename='menu.js') }}"></script>

<!-- 登录态：菜单项固定全部显示，未登录也能点进去（由后端返回 401 提示） -->
<!-- sessionId 存 sessionStorage：只在当前标签页有效，关掉标签页就要重新登录 -->
<script>
(function () {
    // 取出当前标签页保存的 sessionId，供需要登录态的接口放进请求头
    window.currentSessionId = function () {
        return sessionStorage.getItem('sessionId') || '';
    };

    // 后端返回 401（请求头没带 sessionID 或已失效）时，在结果区显示提示
    window.showUnauthorized = function (result) {
        if (result) result.textContent = '401 未登录';
    };
})();
</script>

<!-- ==================== 个人中心 4 个操作的请求逻辑 ====================
     4 个面板同在一个页面里，切换由 menu.js 负责（改 URL 上的 ?action=）。
     这里只做一件事：给每个表单绑 submit，各自发各自的方法和请求体。
     注意：隐藏的面板只是 display:none，元素依然在 DOM 里，所以 4 个
     事件可以一次性全部绑定，不用等面板显示出来再绑。
===================================================================== -->
<script>
(function () {
    var result        = document.getElementById('result');
    var info_id       = document.getElementById('info_id');
    var info_username = document.getElementById('info_username');

    /* 把响应写进 #result */
    function show(data) {
        if (result) result.textContent = JSON.stringify(data, null, 2);
    }

    /* 解析响应体：204 没有内容，非 JSON 时兜底成 { raw } 不报错 */
    function parseBody(resp) {
        return resp.text().then(function (text) {
            if (resp.status === 204 || !text.trim()) {
                return { code: 204, message: 'no content' };
            }
            try {
                return JSON.parse(text);
            } catch (err) {
                return { raw: text.slice(0, 300) };
            }
        });
    }

    /* 四个操作共用这一个函数：只有 method 和 body 不同 */
    function callApi(method, body) {
        var sessionID = window.currentSessionId ? window.currentSessionId() : '';
        if (!sessionID) {                      // 本地没 sessionId，干脆不发请求
            show({ code: 401, message: 'Unauthorized' });
            return Promise.resolve(null);
        }

        result.textContent = '请求中…';

        var opt = { method: method, headers: { 'Session-ID': sessionID } };
        if (body) {                            // GET 不带请求体
            opt.headers['Content-Type'] = 'application/json';
            opt.body = JSON.stringify(body);
        }

        return fetch('/users/me', opt)
            .then(parseBody)
            .then(function (data) {
                show(data);
                return data;
            })
            .catch(function (err) {
                show({ error: String(err) });
                return null;
            });
    }

    /* ---------- 3. 查看个人信息  GET /users/me ---------- */
    function loadInfo() {
        callApi('GET').then(function (data) {
            if (data && data.code === 200 && data.data) {
                info_id.value       = data.data.userID;
                info_username.value = data.data.username;
            }
        });
    }

    document.getElementById('me_info_form').addEventListener('submit', function (e) {
        e.preventDefault();                    // 不加这句浏览器会整页刷新
        loadInfo();
    });

    /* ---------- 5. 修改用户名  PATCH { new_username, password } ---------- */
    document.getElementById('me_username_form').addEventListener('submit', function (e) {
        e.preventDefault();
        callApi('PATCH', {
            new_username: document.getElementById('new_username').value,
            password:     document.getElementById('un_password').value
        });
    });

    /* ---------- 6. 修改密码  PATCH { old_password, new_password } ---------- */
    document.getElementById('me_password_form').addEventListener('submit', function (e) {
        e.preventDefault();
        callApi('PATCH', {
            old_password: document.getElementById('old_password').value,
            new_password: document.getElementById('new_password').value
        });
    });

    /* ---------- 7. 注销账号  DELETE { password } ---------- */
    document.getElementById('me_delete_form').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!window.confirm('注销后账号不可恢复，确定继续？')) return;

        callApi('DELETE', {
            password: document.getElementById('del_password').value
        }).then(function (data) {
            if (data && data.code === 204) {
                sessionStorage.removeItem('sessionId');   // 凭据已失效，清掉
                window.alert('账号已注销');
                location.href = '/login';
            }
        });
    });

    /* 只有默认停在「查看个人信息」时才自动拉一次数据 */
    window.addEventListener('load', function () {
        var action = new URLSearchParams(location.search).get('action') || 'info';
        if (action === 'info') loadInfo();
    });
})();
</script>

</body>
</html>
