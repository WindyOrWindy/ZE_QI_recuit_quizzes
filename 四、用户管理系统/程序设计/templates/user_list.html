<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>查看用户列表</title>
<style>
    .left_item{
        position: relative;
        width: 120px;
        height: 50px;
        line-height: 50px;
        text-align: center;
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        cursor: pointer;
        display: block;             
        box-sizing: border-box;
        color: #333;
        text-decoration: none;
    }
    .left_item:hover{ background-color: #e4e4e4; }
    .left_item.active{
        background-color: #d4c7c7; 
        font-weight: bold;
    }

    #self{ height: auto; }

    .right_context1{
        position: relative;
        margin-top: -200px;     
        float: left;
        left: 23%;
        width: 71%;
        min-height: 200px;         
        line-height: 50px;
        text-align: center;
        background-color: #d4c7c7;
        border: 1px solid #ccc;
        cursor: pointer;
        padding: 20px;
        box-sizing: border-box;
    }

    .right_context1 h2{
        margin: 0;
        font-size: 18px;
        line-height: 40px;
    }
    .api_info{
        margin-bottom: 10px;
        padding: 0 10px;
        background-color: #efe9e9;
        border: 1px dashed #b5a8a8;
        font-size: 13px;
        line-height: 26px;
    }
    .field{
        line-height: 30px;
    }
    .field label{
        display: inline-block;
        width: 70px;
        text-align: right;
        margin-right: 8px;
    }
    .field input{
        width: 200px;
        height: 26px;
        line-height: 26px;
        padding: 0 6px;
        border: 1px solid #999;
        box-sizing: border-box;
    }
    button{
        height: 30px;
        padding: 0 18px;
        cursor: pointer;
    }

    .user_row{
        padding: 0 10px;
        line-height: 28px;
        font-size: 13px;
        text-align: left;
        border-bottom: 1px dashed #b5a8a8;
    }

    #result{
        margin-top: 14px;
        padding: 8px 10px;
        min-height: 20px;
        background-color: #f7f4f4;
        border: 1px solid #b5a8a8;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 18px;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
    }
</style>
</head>
<body>

<a class="left_item" id="sign_up" href="/register">用户注册</a>
<a class="left_item" id="sign_in" href="/login">用户登录</a>
<a class="left_item active" id="users_list" href="/user_list">查看用户列表</a>
<div class="left_item" id="self">个人中心
    <div>
        <a class="left_item" id="self_info" href="/me?action=info">查看个人信息</a>
        <a class="left_item" id="self_edit_username" href="/me?action=username">修改用户名</a>
        <a class="left_item" id="self_edit_password" href="/me?action=password">修改密码</a>
        <a class="left_item" id="self_delete" href="/me?action=delete">注销账号</a>
    </div>
</div>

<div class="right_context1">
    <h2>查看用户列表</h2>

    <div class="api_info">GET /users/user_list</div>
    <div class="api_info">请求头：</div>
    <form id="user_list_form">
        
    </form>

    <!-- 响应：200 { data: [...], total, page, limit } -->
    <div id="result">响应(sessionId)将显示在这里</div>
</div>

<!-- 左侧菜单切换（四个页面共用） -->
<script src="{{ url_for('static', filename='menu.js') }}"></script>

<script>
(function () {
    window.currentSessionId = function () {
        return sessionStorage.getItem('sessionId') || '';
    };

    window.showUnauthorized = function (result) {
        if (result) result.textContent = '401 未登录';
    };
})();
</script>

<script>
    // 把用户列表填进 form
    function renderUserList(form, list) {
        form.innerHTML = '';                 // 先清空，避免再次请求时内容叠加

        if (!list || !list.length) {
            var empty = document.createElement('div');
            empty.className = 'user_row';
            empty.textContent = '（暂无用户）';
            form.appendChild(empty);
            return;
        }

        list.forEach(function (u) {
            var row = document.createElement('div');
            row.className = 'user_row';
            row.textContent = u.username; 
            form.appendChild(row);
        });
    }

    function myFunction() {
        var result = document.getElementById('result');
        var form   = document.getElementById('user_list_form');
        if (!result) return;

        var sessionID = window.currentSessionId ? window.currentSessionId() : '';

        if (!sessionID) {
            result.textContent = JSON.stringify({ code: 401, message: 'Unauthorized' }, null, 2);
            return;
        }

        result.textContent = '请求中…';

        fetch('/users/user_list', {
            method: 'GET',
            headers: { 'Session-ID': sessionID }
        })
        .then(function (resp) {
            return resp.text().then(function (text) {
                try {
                    return JSON.parse(text);              // 正常 JSON
                } catch (err) {
                    return { raw: text.slice(0, 300) };   // 不是 JSON（比如后端报错页）
                }
            });
        })
        .then(function (data) {
            result.textContent = JSON.stringify(data, null, 2);   // 显示完整响应，方便排查
            //  只有 200 才把用户名填进 form
            if (data && data.code === 200) {
                renderUserList(form, data.data);
            }
        })
        .catch(function (err) {
            result.textContent = '请求失败：' + err;
        });
    }

    window.addEventListener('load', myFunction);
</script>

</body>
</html>
